# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = io.github.carlosm.tabswitcherextreme
pluginName = Tab Switcher Extreme
# SemVer format -> https://semver.org
pluginVersion = 1.2.0

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# for insight into build numbers and IntelliJ Platform versions.
pluginSinceBuild = 252

# IntelliJ Platform version used to compile the plugin (the lowest supported version)
# -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-dependencies-extension.html
platformVersion = 2025.2.6
# Additional IDE versions checked by the Plugin Verifier (comma-separated)
verifierIdeVersions = 2025.2.6, 2026.2.3


# Java language level -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html#platform-versions
# 2025.2 (252) runs on Java 21
javaVersion = 21

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.9.0

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
